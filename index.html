<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russ is a Drunk</title>

    <!-- Social Media & iMessage / Text Sharable Thumbnail Meta Tags -->
    <meta property="og:title" content="Russ is a Drunk - Fantasy Football Recap">
    <meta property="og:description" content="Week 1 Overreactions: Two Truths and a Lie">
    <meta property="og:image" content="https://freshpotatos6.github.io/Russ-Is-a-Drunk-2026/images/Favre.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://freshpotatos6.github.io/Russ-Is-a-Drunk-2026/images/Favre.png">
    <link rel="icon" type="image/png" href="images/Favre.png">
    <link rel="apple-touch-icon" href="images/Favre.png">

    <style>
        :root {
            --chiefs-red: #E31837;
            --chiefs-red-dark: #660312;
            --chiefs-gold: #FFB81C;
            --chiefs-gold-light: #FFDF80;
            --card-bg-dark: #120306;
            --card-inner-dark: #1c080d;
            --text-main: #ffffff;
            --text-muted: #e2e8f0;
            --accent-green: #4ade80;
            --accent-red: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: 
                radial-gradient(circle at 50% 0%, rgba(255, 184, 28, 0.15) 0%, transparent 60%),
                linear-gradient(180deg, var(--chiefs-red-dark) 0%, #080102 100%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            max-width: 900px;
            width: 100%;
            background: linear-gradient(135deg, var(--chiefs-gold-light) 0%, var(--chiefs-gold) 100%);
            border: 4px solid #ffffff;
            border-radius: 16px;
            padding: 1.25rem 1rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.5);
        }

        header h1 {
            font-size: 2.75rem;
            font-weight: 900;
            letter-spacing: 0.02em;
            color: #111111;
            text-shadow: 2px 2px 0px #ffffff, 4px 4px 0px rgba(0,0,0,0.15);
            text-transform: uppercase;
        }

        .tabs-wrapper {
            width: 100%;
            max-width: 1050px;
            overflow-x: auto;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            scrollbar-width: thin;
            scrollbar-color: var(--chiefs-gold) transparent;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            min-width: max-content;
        }

        .tab-btn {
            background-color: #24050a;
            color: #fff;
            border: 2px solid var(--chiefs-red);
            padding: 0.6rem 1.1rem;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background-color: var(--chiefs-red);
            border-color: var(--chiefs-gold);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: linear-gradient(180deg, var(--chiefs-gold-light) 0%, var(--chiefs-gold) 100%);
            color: #000000;
            border-color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 184, 28, 0.6);
            font-weight: 900;
        }

        .tab-btn.playoff-btn {
            background-color: #1a0004;
            border-color: var(--chiefs-gold);
            color: var(--chiefs-gold);
        }

        main {
            width: 100%;
            max-width: 1050px;
        }

        .tab-content {
            background-color: var(--card-bg-dark);
            background-image: 
                radial-gradient(ellipse at top, rgba(227, 24, 55, 0.25) 0%, transparent 70%),
                linear-gradient(rgba(255, 184, 28, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 184, 28, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            border: 3px solid var(--chiefs-gold);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85);
            animation: fadeIn 0.3s ease;
        }

        .coming-soon-box {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-muted);
        }

        .coming-soon-box h3 {
            font-size: 1.8rem;
            color: var(--chiefs-gold);
            margin-bottom: 0.5rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        #bgm-toggle-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(180deg, var(--chiefs-gold-light) 0%, var(--chiefs-gold) 100%);
            color: #000;
            border: 2px solid #fff;
            padding: 0.65rem 1.25rem;
            border-radius: 30px;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #bgm-toggle-btn:hover {
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>🏈 Russ is a Drunk</h1>
    </header>

    <div class="tabs-wrapper">
        <div class="tabs" id="tabs-container">
            <button class="tab-btn active" onclick="loadWeek(event, 'week-1')">Week 1</button>
            <button class="tab-btn" onclick="loadWeek(event, 'week-2')">Week 2</button>
            <button class="tab-btn" onclick="loadWeek(event, 'week-3')">Week 3</button>
            <button class="tab-btn" onclick="loadWeek(event, 'week-4')">Week 4</button>
            <button class="tab-btn" onclick="loadWeek(event, 'week-5')">Week 5</button>
            <button class="tab-btn" onclick="loadWeek(event, 'week-6')">Week 6</button>
            <button class="tab-btn" onclick="loadWeek(event, 'week-7')">Week 7</button>
            <button class="tab-btn" onclick="loadWeek(event, 'week-8')">Week 8</button>
            <button class="tab-btn" onclick="loadWeek(event, 'week-9')">Week 9</button>
            <button class="tab-btn" onclick="loadWeek(event, 'week-10')">Week 10</button>
            <button class="tab-btn" onclick="loadWeek(event, 'week-11')">Week 11</button>
            <button class="tab-btn" onclick="loadWeek(event, 'week-12')">Week 12</button>
            <button class="tab-btn" onclick="loadWeek(event, 'week-13')">Week 13</button>
            <button class="tab-btn" onclick="loadWeek(event, 'week-14')">Week 14</button>
            <button class="tab-btn" onclick="loadWeek(event, 'week-15')">Week 15</button>
            <button class="tab-btn playoff-btn" onclick="loadWeek(event, 'playoffs-w1')">Playoffs W1</button>
            <button class="tab-btn playoff-btn" onclick="loadWeek(event, 'championship')">Championship</button>
        </div>
    </div>

    <main>
        <article id="content-area" class="tab-content">
            <!-- Dynamic week fragments load here -->
        </article>
    </main>

    <audio id="bgm-player" loop preload="auto" playsinline>
        <source src="audio/backyard.mp3" type="audio/mpeg">
    </audio>

    <button id="bgm-toggle-btn" onclick="toggleBGM()">🔊 ON</button>

    <script>
        const bgm = document.getElementById('bgm-player');
        bgm.volume = 0.08;
        let isBgmActive = true;
        let hasUnlockedAudio = false;

        function primeAllVideos() {
            const videos = document.querySelectorAll('.card-video');
            videos.forEach(v => {
                v.muted = false;
                const p = v.play();
                if (p !== undefined) {
                    p.then(() => {
                        v.pause();
                        v.currentTime = 0;
                    }).catch(() => {});
                }
            });
        }

        function unlockAudioOnFirstInteraction() {
            if (hasUnlockedAudio) return;
            hasUnlockedAudio = true;

            window.removeEventListener('touchstart', unlockAudioOnFirstInteraction, true);
            window.removeEventListener('click', unlockAudioOnFirstInteraction, true);
            window.removeEventListener('pointerdown', unlockAudioOnFirstInteraction, true);

            if (isBgmActive) {
                bgm.play().then(() => {
                    const btn = document.getElementById('bgm-toggle-btn');
                    if (btn) btn.innerHTML = "🔊 ON";
                }).catch(err => console.log("BGM playback blocked on first touch:", err));
            }

            primeAllVideos();
        }

        window.addEventListener('touchstart', unlockAudioOnFirstInteraction, { capture: true, passive: true });
        window.addEventListener('click', unlockAudioOnFirstInteraction, { capture: true, passive: true });
        window.addEventListener('pointerdown', unlockAudioOnFirstInteraction, { capture: true, passive: true });

        function toggleBGM() {
            if (!hasUnlockedAudio) {
                unlockAudioOnFirstInteraction();
                return;
            }
            const btn = document.getElementById('bgm-toggle-btn');
            if (bgm.paused) {
                isBgmActive = true;
                bgm.play().then(() => {
                    btn.innerHTML = "🔊 ON";
                }).catch(err => console.log("Audio play blocked by browser:", err));
            } else {
                isBgmActive = false;
                bgm.pause();
                btn.innerHTML = "🔇 OFF";
            }
        }

        async function loadWeek(evt, weekId) {
            if (evt && !hasUnlockedAudio) {
                unlockAudioOnFirstInteraction();
            }

            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            if (evt) {
                evt.currentTarget.classList.add('active');
            } else {
                const firstBtn = document.querySelector(`.tab-btn[onclick*="${weekId}"]`);
                if (firstBtn) firstBtn.classList.add('active');
            }

            const contentArea = document.getElementById('content-area');

            try {
                const response = await fetch(`weeks/${weekId}.html`);
                if (response.ok) {
                    const html = await response.text();
                    contentArea.innerHTML = html;

                    // Execute scripts embedded inside loaded fragments
                    const scripts = contentArea.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    // Re-initialize week specific hooks if available
                    if (weekId === 'week-2' && typeof window.initWeek2Quiz === 'function') {
                        window.initWeek2Quiz();
                    }

                    initScrollMedia();
                    if (hasUnlockedAudio) {
                        primeAllVideos();
                    }
                } else {
                    const formattedTitle = weekId.replace('-', ' ').toUpperCase();
                    contentArea.innerHTML = `
                        <div class="coming-soon-box">
                            <h3>${formattedTitle} Recap</h3>
                            <p>Coming soon...</p>
                        </div>`;
                }
            } catch (err) {
                console.error("Error loading week fragment:", err);
                contentArea.innerHTML = `<div class="coming-soon-box"><h3>Error Loading Content</h3></div>`;
            }
        }

        function stopAllVideosExcept(currentVideo) {
            const allVideos = document.querySelectorAll('.card-video');
            allVideos.forEach(vid => {
                if (vid !== currentVideo) {
                    vid.pause();
                    vid.currentTime = 0;
                    vid.classList.add('hidden');
                    const img = vid.parentElement ? vid.parentElement.querySelector('.card-image') : null;
                    if (img) img.classList.remove('hidden');
                }
            });
        }

        function playVideo(wrapper, video, img) {
            stopAllVideosExcept(video);
            img.classList.add('hidden');
            video.classList.remove('hidden');
            video.currentTime = 0;
            video.muted = false;
            
            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    if (isBgmActive && bgm.paused) {
                        bgm.play().catch(() => {});
                    }
                }).catch(err => {
                    console.warn("Autoplay rejected by browser:", err);
                });
            }
        }

        function stopAndRevertToImage(video, img) {
            video.pause();
            video.currentTime = 0;
            video.classList.add('hidden');
            img.classList.remove('hidden');
        }

        let mediaObserver = null;

        function initScrollMedia() {
            if (mediaObserver) {
                mediaObserver.disconnect();
            }

            const mediaWrappers = document.querySelectorAll('.card-media-wrapper');

            mediaObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const wrapper = entry.target;
                    const video = wrapper.querySelector('.card-video');
                    const img = wrapper.querySelector('.card-image');

                    if (entry.isIntersecting && video && !wrapper.dataset.hasPlayed) {
                        wrapper.dataset.hasPlayed = "true";
                        if (hasUnlockedAudio) {
                            playVideo(wrapper, video, img);
                        }
                    }
                });
            }, { 
                threshold: 0.25,
                rootMargin: '0px 0px -10% 0px' 
            });

            mediaWrappers.forEach(wrapper => {
                const video = wrapper.querySelector('.card-video');
                const img = wrapper.querySelector('.card-image');

                if (video && img) {
                    video.load();
                    mediaObserver.observe(wrapper);

                    video.addEventListener('ended', () => {
                        stopAndRevertToImage(video, img);
                    });

                    wrapper.onclick = (e) => {
                        e.stopPropagation();
                        if (!hasUnlockedAudio) {
                            unlockAudioOnFirstInteraction();
                        }
                        if (!video.paused && !video.classList.contains('hidden')) {
                            stopAndRevertToImage(video, img);
                        } else {
                            playVideo(wrapper, video, img);
                        }
                    };
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadWeek(null, 'week-1');
        });
    </script>
</body>
</html>
